name: Publish quick start page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run live:build
      - run: node scripts/quick-install-page.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    # 배포가 끝나면 그 버전의 GitHub 릴리스를 만든다(이미 있으면 건너뛴다).
    # v0.70 이하 설치본은 릴리스 번호로 새 버전을 확인하므로, 릴리스를 손으로 만들다 빠뜨리면 "최신"이라고 잘못 안내된다.
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node scripts/release-notes.mjs notes.md)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v 릴리스가 이미 있습니다."
          else
            head -n 1 notes.md > title.txt
            tail -n +3 notes.md > body.md
            gh release create "$v" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file body.md
          fi
