name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run setup
      - run: npm run doctor
      - run: npm run check
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/install-control-panel.ps1 -NoShortcut
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-attachments.txt
      - run: npm test
      - run: npm run test:attachments
